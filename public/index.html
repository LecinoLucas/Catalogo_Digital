/* ===== utilitários ===== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  const add = (c) => Array.isArray(c) ? c.forEach(add) : c != null && c !== false && e.append(c.nodeType ? c : document.createTextNode(c));
  kids.forEach(add);
  return e;
}
const slug = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

const VERSAO = "v3";

/* ===== estado ===== */
let cat = null, admin = false, aba = null, busca = "", estatico = false, fechandoPorVoltar = false;

/* ===== aviso (popover: fica acima dos diálogos) ===== */
function toast(t) {
  document.querySelectorAll(".toast").forEach((x) => x.remove());
  const el = h("div", { class: "toast m-0 inset-auto left-1/2 top-4 -translate-x-1/2 rounded-full border-0 bg-ink px-5 py-3 text-sm font-semibold text-white shadow-xl animate-pop", role: "status", popover: "manual" }, t);
  document.body.append(el);
  try { el.showPopover(); } catch (_) { el.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:100"; }
  setTimeout(() => el.remove(), 2600);
}

/* ===== fotos protegidas ===== */
function setMarcaSvg(texto) {
  const t = String(texto || "").replace(/[<>&"']/g, "");
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><text x='120' y='125' fill='white' fill-opacity='0.35' font-family='Arial' font-weight='700' font-size='22' text-anchor='middle' transform='rotate(-28 120 120)'>${t}</text></svg>`;
  document.documentElement.style.setProperty("--marca-svg", `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
}
document.addEventListener("contextmenu", (e) => { if (e.target.closest(".photo")) e.preventDefault(); });
document.addEventListener("dragstart", (e) => { if (e.target.closest(".photo")) e.preventDefault(); });

function carregaFoto(el) {
  const im = new Image();
  im.onload = () => { el.style.backgroundImage = `url("${el.dataset.src}")`; el.removeAttribute("data-loading"); };
  im.onerror = () => el.removeAttribute("data-loading");
  im.src = el.dataset.src;
}
const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => {
  es.forEach((en) => { if (en.isIntersecting) { carregaFoto(en.target); io.unobserve(en.target); } });
}, { rootMargin: "400px" }) : null;
function photo(url, label, cls = "", eager = false) {
  const p = h("div", { class: "photo " + cls, role: "img", "aria-label": label || "Foto do produto", "data-src": url });
  if (!url) return p;
  p.setAttribute("data-loading", "");
  if (io && !eager) io.observe(p); else carregaFoto(p);
  return p;
}

/* marca d'água nos uploads (mesma do script do seed) */
async function marcar(file, texto) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), hgt = Math.round(bmp.height * k);
  const c = document.createElement("canvas"); c.width = w; c.height = hgt;
  const g = c.getContext("2d");
  g.drawImage(bmp, 0, 0, w, hgt);
  const size = Math.max(16, Math.round(w / 22));
  g.save();
  g.translate(w / 2, hgt / 2); g.rotate(-28 * Math.PI / 180);
  g.font = `700 ${size}px Arial,sans-serif`; g.fillStyle = "rgba(255,255,255,.23)";
  g.textAlign = "center"; g.textBaseline = "middle";
  const sx = Math.round(size * texto.length * 0.8), sy = Math.round(size * 4.2), diag = Math.hypot(w, hgt);
  let row = 0;
  for (let y = -diag; y < diag; y += sy, row++)
    for (let x = -diag; x < diag; x += sx) g.fillText(texto, x + (row % 2 ? sx / 2 : 0), y);
  g.restore();
  const cs = Math.max(14, Math.round(w / 30)), pad = Math.max(10, Math.round(w / 50));
  g.font = `700 ${cs}px Arial,sans-serif`; g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillStyle = "rgba(0,0,0,.6)"; g.fillText(texto, pad + 2, hgt - pad + 2);
  g.fillStyle = "rgba(255,255,255,.92)"; g.fillText(texto, pad, hgt - pad);
  return new Promise((ok, no) => c.toBlob((b) => b ? ok(b) : no(new Error("Falha ao processar a foto.")), "image/jpeg", 0.82));
}

/* ===== WhatsApp: vários números, uma decisão por vez ===== */
const zaps = () => (cat.empresa.whatsapps || []).map((n) => String(n).replace(/\D/g, "")).filter((n) => n.length >= 10)
  .map((n) => (n.length <= 11 ? "55" + n : n));
const fmtZap = (n) => { const l = n.replace(/^55/, ""); return l.length === 11 ? `(${l.slice(0, 2)}) ${l.slice(2, 7)}-${l.slice(7)}` : l.length === 10 ? `(${l.slice(0, 2)}) ${l.slice(2, 6)}-${l.slice(6)}` : n; };
const msgPadrao = () => `Olá! Vim pelo catálogo da ${cat.empresa.nome} e gostaria de atendimento.`;

const LABEL_CTA = "Falar com vendedor no WhatsApp";
function zapButton({ label = LABEL_CTA, msg = msgPadrao, cls, wrap = "", soIcone = false }) {
  const nums = zaps();
  if (!nums.length) return null;
  const content = soIcone ? [icon("wa", "size-7"), h("span", { class: "sr-only" }, label)]
    : [icon("wa", "size-5"), h("span", { class: "text-center leading-tight" }, label)];
  if (nums.length === 1) {
    const url = () => `https://wa.me/${nums[0]}?text=${encodeURIComponent(msg())}`;
    return h("div", { class: wrap }, h("a", { class: cls, href: url(), target: "_blank", rel: "noopener",
      onclick: (e) => { e.currentTarget.href = url(); } }, content));
  }
  return h("div", { class: wrap }, h("button", { type: "button", class: cls, "aria-haspopup": "dialog", onclick: () => abrirGaveta(msg) }, content));
}
/* gaveta: aparece só quando há mais de um número (Lei de Hick) */
function abrirGaveta(msg) {
  const dlg = $("#dlg-zap");
  const url = (n) => `https://wa.me/${n}?text=${encodeURIComponent(msg())}`;
  dlg.replaceChildren(h("div", { class: "p-4 pb-[max(1rem,env(safe-area-inset-bottom))] md:p-6" },
    h("div", { class: "mx-auto mb-3 h-1.5 w-10 rounded-full bg-line md:hidden" }),
    h("div", { class: "flex items-start justify-between gap-3" },
      h("div", {}, h("h2", { class: "text-xl font-extrabold" }, "Falar com vendedor"),
        h("p", { class: "mt-1 text-[15px] text-muted" }, "Escolha com qual número quer conversar.")),

/* arrastar a alça para baixo fecha a folha (gesto nativo) */
function ativarArraste(dlg, zona) {
  let y0 = null, dy = 0, t0 = 0;
  zona.addEventListener("pointerdown", (e) => { y0 = e.clientY; dy = 0; t0 = e.timeStamp; zona.setPointerCapture(e.pointerId); dlg.style.transition = "none"; });
  zona.addEventListener("pointermove", (e) => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); dlg.style.transform = `translateY(${dy}px)`; });
  const fim = (e) => {
    if (y0 == null) return;
    const v = dy / Math.max(1, e.timeStamp - t0);
    dlg.style.transition = "transform .2s ease";
    if (dy > 120 || v > 0.6) {
      dlg.style.transform = "translateY(100%)";
      setTimeout(() => { dlg.close(); dlg.style.transform = ""; dlg.style.transition = ""; }, 180);
    } else { dlg.style.transform = ""; setTimeout(() => { dlg.style.transition = ""; }, 220); }
    y0 = null;
  };
  zona.addEventListener("pointerup", fim);
  zona.addEventListener("pointercancel", fim);
}

document.addEventListener("click", (e) => {
  const d = e.target.closest("dialog");

});
$("#dlg-produto").addEventListener("close", () => {

  if (history.state && history.state.p) history.back();
  else if (location.hash.startsWith("#produto/")) history.replaceState(null, "", "#" + (aba || ""));
});
window.addEventListener("popstate", () => {
  const dlg = $("#dlg-produto");
  const m = location.hash.match(/^#produto\/(.+)$/);
  if (m && cat) { if (!dlg.open) abrirProduto(decodeURIComponent(m[1]), true); }
  else if (dlg.open) { fechandoPorVoltar = true; dlg.close(); }

}
async function mover(id, dir) {
  const novo = clone(cat), i = novo.produtos.findIndex((p) => p.id === id);
  let j = i + dir;
  while (j >= 0 && j < novo.produtos.length && novo.produtos[j].aba !== novo.produtos[i].aba) j += dir;
  if (j < 0 || j >= novo.produtos.length) return;
  [novo.produtos[i], novo.produtos[j]] = [novo.produtos[j], novo.produtos[i]];
  try { await salvar(novo); renderGrade(); } catch (e) { toast(e.message); }
}

      existente ? h("button", { class: C.danger, type: "button", "aria-label": "Excluir produto", onclick: async () => {
        if (!confirm(`Excluir "${p.nome}"?`)) return;

        try { await salvar(novo); dlg.close(); render(); toast("Excluído"); } catch (err) { msg.className = "mt-2 min-h-5 text-sm font-medium text-red-700"; msg.textContent = err.message; }
      } }, icon("trash", "size-4"), "Excluir") : null));
  dlg.replaceChildren(h("div", { class: "px-5 pt-0 md:px-8" }, cabecalhoEditor(existente ? "Editar produto" : "Novo produto")), form);

/* ===== editor de empresa e abas ===== */
function editarEmpresa() {
  const e = cat.empresa, dlg = $("#dlg-editor");
  const F = {}; const linhas = [];
  const campo = (k, rot, tipo = "input", extra = {}) => {
    const el = tipo === "textarea" ? h("textarea", { id: "c-" + k, class: C.area }, Array.isArray(e[k]) ? e[k].join("\n") : e[k] || "") : h("input", { id: "c-" + k, value: e[k] || "", class: C.input, ...extra });
    F[k] = el; linhas.push(h("label", { for: "c-" + k, class: C.label }, rot), el);
  };
  campo("nome", "Nome da empresa"); campo("slogan", "Frase de destaque"); campo("descricao", "Descrição", "textarea");
  campo("destaque", "Faixa de destaque (aparece no topo)"); campo("rodape", "Provas sociais (separe com •)");
  campo("instagram", "Instagram (sem @)"); campo("whatsapps", "WhatsApp com DDD (um número por linha)", "textarea");
  campo("marca", "Texto da marca d'água (fotos novas)"); campo("cor", "Cor da marca", "input", { type: "color" });
  F.cor.className = "h-12 w-24 rounded-xl border border-line bg-white p-1";
  let abas = clone(cat.abas);
  const abasEl = h("div"), msg = h("p", { class: "mt-2 min-h-5 text-sm font-medium", role: "status" });
  const pinta = () => abasEl.replaceChildren(...abas.map((a, i) => {
    const usado = cat.produtos.some((p) => p.aba === a.id);
    return h("div", { class: "mb-2 grid grid-cols-[1fr_auto_auto_auto] gap-2" },
      h("input", { value: a.nome, "aria-label": "Nome da aba", class: C.input, oninput: (ev) => { a.nome = ev.target.value; } }),
      h("button", { type: "button", class: C.btn + " px-3", disabled: i === 0, "aria-label": "Mover para cima", onclick: () => { [abas[i - 1], abas[i]] = [abas[i], abas[i - 1]]; pinta(); } }, icon("up2", "size-4")),
      h("button", { type: "button", class: C.btn + " px-3", disabled: i === abas.length - 1, "aria-label": "Mover para baixo", onclick: () => { [abas[i + 1], abas[i]] = [abas[i], abas[i + 1]]; pinta(); } }, icon("down2", "size-4")),
      h("button", { type: "button", class: C.btn + " px-3", disabled: usado, title: usado ? "Mova ou exclua os produtos desta aba antes" : "", "aria-label": "Remover aba", onclick: () => { abas.splice(i, 1); pinta(); } }, icon("x", "size-4")));
  }));
  pinta();
  const form = h("form", { class: "px-5 md:px-8", onsubmit: async (ev) => {
    ev.preventDefault();
    const novo = clone(cat);
    novo.empresa = { ...e, nome: F.nome.value.trim(), slogan: F.slogan.value.trim(), descricao: F.descricao.value.trim(),
      destaque: F.destaque.value.trim(), rodape: F.rodape.value.trim(), instagram: F.instagram.value.trim().replace(/^@/, ""),
      whatsapps: F.whatsapps.value.split("\n").map((n) => n.replace(/\D/g, "")).filter(Boolean),
      marca: F.marca.value.trim(), cor: F.cor.value };
    delete novo.empresa.beneficios;
    const usados = new Set(); novo.abas = abas.filter((a) => a.nome.trim()).map((a) => {
      let id = a.id || slug(a.nome) || "aba"; while (usados.has(id)) id += "-2"; usados.add(id); return { id, nome: a.nome.trim() };
    });
    try { msg.textContent = "Salvando…"; await salvar(novo); dlg.close(); render(); toast("Salvo"); }
    catch (err) { msg.className = "mt-2 min-h-5 text-sm font-medium text-red-700"; msg.textContent = err.message; }
  } }, ...linhas,
    h("p", { class: C.label }, "Abas"), abasEl,
    h("button", { type: "button", class: C.btn, onclick: () => { abas.push({ id: "", nome: "" }); pinta(); } }, icon("plus", "size-4"), "Aba"), msg,
    h("div", { class: "sticky bottom-0 -mx-5 mt-8 flex gap-2 border-t border-line bg-white/95 px-5 py-3 pb-[max(.75rem,env(safe-area-inset-bottom))] backdrop-blur md:-mx-8 md:px-8" },
      h("button", { class: C.pri, type: "submit" }, "Salvar"), h("button", { class: C.btn, type: "button", "data-fechar": "" }, "Cancelar")));
  dlg.replaceChildren(h("div", { class: "px-5 pt-0 md:px-8" }, cabecalhoEditor("Empresa e abas")), form);
  dlg.scrollTop = 0; dlg.showModal();
}

/* ===== início ===== */
function esqueleto() {
  $("#grade").replaceChildren(...Array.from({ length: 6 }, () => h("div", { class: "animate-pulse overflow-hidden rounded-2xl bg-white ring-1 ring-line" },
    h("div", { class: "aspect-[4/5] bg-line" }), h("div", { class: "space-y-2 p-4" }, h("div", { class: "h-3 w-1/3 rounded bg-line" }), h("div", { class: "h-4 w-4/5 rounded bg-line" })))));
}
(async function init() {
  esqueleto();
  $("#btn-busca").append(icon("search", "size-6"));
  try {
    try {
      [cat, { admin }] = await Promise.all([api("catalog"), api("me").catch(() => ({ admin: false }))]);
    } catch (_) {
      // Modo estático (sem backend): lê o catálogo direto dos arquivos publicados.
      const r = await fetch("/seed/catalog.json");
      if (!r.ok) throw new Error("sem catálogo");
      cat = JSON.parse((await r.text()).replace(/\/api\/img\/seed-/g, "/seed/"));
      admin = false; estatico = true;
    }
    const hash = decodeURIComponent(location.hash.slice(1));
    aba = cat.abas.some((a) => a.id === hash) ? hash : null;
    render();
    const m = hash.match(/^produto\/(.+)$/);
    if (m) abrirProduto(m[1], true);
  } catch (err) {
    $("#grade").replaceChildren(h("div", { class: "col-span-full rounded-3xl bg-white p-10 text-center ring-1 ring-line" },
      h("h3", { class: "text-xl font-extrabold" }, "Não foi possível carregar o catálogo"), h("p", { class: "mt-1 text-muted" }, "Atualize a página em alguns instantes.")));
  }
})();
</script>
